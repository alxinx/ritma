version: '3.8'

services:
  app:
    build: .
    ports:
      - "2028:2028"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8
    restart: always
    command: --lower_case_table_names=1  
    environment:
      - MYSQL_DATABASE=ritma
      - MYSQL_ROOT_PASSWORD=ritmapass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=ritmapass"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"

volumes:
  mysql_data: